<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Giant24924 Admin</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #0f172a; color: white; padding: 50px; }
        button { padding: 15px 30px; margin: 10px; cursor: pointer; border-radius: 8px; border: none; background: #3b82f6; color: white; font-weight: bold; font-size: 16px; }
        button:hover { background: #2563eb; }
    </style>
</head>
<body>
    <h1>ระบบแอดมิน Giant24924</h1>
    <button onclick="updateSettings({autoMod: true})">เปิด AutoMod</button>
    <button onclick="updateSettings({autoMod: false})">ปิด AutoMod</button>
    
    <script>
        async function updateSettings(data) {
            try {
                const response = await fetch('/api/settings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                alert("อัปเดตค่าเรียบร้อยแล้ว!");
            } catch (error) {
                alert("เกิดข้อผิดพลาด: " + error);
            }
        }
    </script>
</body>
</html>
