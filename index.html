<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giant24924 Admin Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen p-6">
    <header class="mb-8">
        <h1 class="text-3xl font-bold">Giant24924</h1>
        <p class="text-gray-400">Admin Management System</p>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
        <div class="bg-gray-800 p-6 rounded-xl border border-gray-700">
            <h2 class="text-xl font-semibold mb-2">Moderation</h2>
            <p class="text-sm text-gray-400">Manage bans and logs</p>
        </div>
        <div class="bg-gray-800 p-6 rounded-xl border border-gray-700">
            <h2 class="text-xl font-semibold mb-2">Verification</h2>
            <p class="text-sm text-gray-400">Pending members: 0</p>
        </div>
        <div class="bg-gray-800 p-6 rounded-xl border border-gray-700">
            <h2 class="text-xl font-semibold mb-2">Settings</h2>
            <p class="text-sm text-gray-400">Automod configurations</p>
        </div>
        <div class="bg-gray-800 p-6 rounded-xl border border-gray-700">
            <h2 class="text-xl font-semibold mb-2">Monetization</h2>
            <p class="text-sm text-gray-400">Check tier status</p>
        </div>
    </div>
</body>
</html>
